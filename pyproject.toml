[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chen-clan-academy-agent"
version = "0.1.0"
description = "Chen Clan Academy local RAG LangGraph agent"
requires-python = ">=3.11"

[tool.setuptools]
py-modules = [
  "agent_graph",
  "rag_ingestion",
  "rag_retrieval",
  "rag_evaluation",
]
