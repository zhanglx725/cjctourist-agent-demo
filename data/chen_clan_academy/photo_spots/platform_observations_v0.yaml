  - observation_id: xhs_20260726_roof_ridge_crafts
    platform: xiaohongshu
    supplied_title_zh: 广州旅游｜陈家祠：屋脊藏神仙，人工天不如
    observation_type: user_supplied_platform_reference
    verification_status: visual_content_received_facts_need_source_check
    possible_subjects:
      - 屋脊陶塑
      - 建筑木雕
      - 聚贤堂
      - 展陈器物
      - 工艺细节摄影
    linked_photo_spot_ids:
      - photo_architecture_roof_ridge
      - photo_juxian_hall_screen_door
      - photo_craft_ornament_route
    visual_observations_from_user_images_zh:
      - 屋脊可分别采用广角远景、斜向仰拍、正面平视和局部特写，突出人物、瑞兽、山墙轮廓与色彩层次。
      - 木雕可采用“整体空间—屏门/构件局部—单幅故事细节”的三层拍法；避免将深色木雕拍成无层次的黑块。
      - 厅堂正面可利用匾额、供桌、屏门和座椅形成轴线对称的室内全景；是否允许人物、三脚架或长时间停留须现场确认。
      - 展柜内工艺品适合做单件细节观察，但截图不能证明展品名称、展厅位置、展期或拍摄许可。
    user_supplied_claims_needing_evidence_zh:
      - 建造年代、集资范围、七种工艺、文物保护等级与博物馆身份，应以项目既有馆方或政府来源为准。
      - “郭沫若题语”、具体纹样题材、历史用途及文学性描写，不因平台文字自动进入导游事实库。
    adoption_rule_zh: >-
      可把截图中的构图方法作为卡片的“平台视觉参考”；屋脊、木雕与厅堂的实体对象仍须使用已审核的点位和 RAG 证据。展柜与室内陈设只有在确认展厅、展品和拍摄规则后，才生成正式打卡卡。
