observations:
  - observation_id: xhs_20260726_morning_photo_time
    platform: xiaohongshu
    supplied_title_zh: 陈家祠出片攻略！快收藏起来~
    short_link: http://xhslink.cn/o/KWPlG7A7FK
    user_supplied_caption_fragment_zh: 建议拍照时间：上午10点前，人少且光线佳
    possible_subjects:
      - 拍照时间
      - 茶艺室前
      - 中西展厅门
      - 聚贤堂
      - 月台
      - 后花园
      - 木雕屏门
      - 大门对联
    linked_photo_spot_ids:
      - photo_architecture_moon_platform
      - photo_architecture_corridor_perspective
      - photo_portrait_entrance_layers
    observation_type: user_supplied_platform_reference
    verification_status: partial_content_received_needs_node_mapping
    user_supplied_shot_list_zh:
      - 茶艺室前。
      - 茶艺室旁中西展厅，以展厅门为背景。
      - 聚贤堂枫溪瓷展柜。
      - 聚贤堂前，以月台石栏杆为前景的长焦构图。
      - 聚贤堂前，走下月台，以石栏板为背景。
      - 月台与后花园。
      - 聚贤堂正对面的木雕屏门。
      - 大门对联处。
      - 馆内桌椅。
      - 后花园，以绿叶为前景的长焦构图。
    verified_facts_zh:
      - 用户提供的帖子文字建议在上午10点前拍摄，并列出十处画面参考；拼图可见建筑屋脊、门窗、石栏板、灰砖墙与绿叶前景等构图方向。
    visual_observations_from_user_images_zh:
      - 人像可采用侧身或半转身、视线朝向屋脊的方式，让彩色屋脊装饰处于画面上方。
      - 可在有红灯笼的廊下利用柱列与屋顶线条拍摄自然行走画面；该画面只能作为构图灵感，具体廊道尚未定位。
      - 可把石栏板、绿叶或灰砖墙作为前景/背景组织近景人像；截图未能证明这些元素分别对应哪一处现有 node_id。
      - 截图含有绿色窗格、室内桌椅和人物靠近栏板的画面；其具体展厅、设施属性与拍摄许可仍未确认。
    unverified_items_zh:
      - “人少且光线佳”是否适用于不同季节、天气、开放时段和人流状况。
      - 茶艺室、中西展厅、枫溪瓷展柜、馆内桌椅等点位在当前空间图中的准确 node_id，以及是否允许拍摄。
      - 展柜、室内桌椅和各展厅的拍摄规则，及是否允许使用长焦镜头。
      - 各机位在当天开放区域、客流和安全条件下是否可用。
    adoption_rule_zh: >-
      可将“上午10点前”作为来源明确、附条件的候选时间窗口，不写成固定最佳时间；涉及展柜、室内陈设与具体展厅的点位，须完成 node_id 映射并核验馆方拍摄规则后，才可生成正式打卡点卡。

