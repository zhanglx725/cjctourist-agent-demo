    verified_facts_zh:
      - 该帖标题可作为“游客对雨天陈家祠拍摄感兴趣”的灵感线索。
    unverified_items_zh:
      - 帖子的实际取景点、人物姿势、构图和拍摄时的降雨强度。
      - 馆内外当日允许拍摄的区域、地面湿滑状况和是否影响通行。
      - 该帖子是否代表稳定的热门趋势。
