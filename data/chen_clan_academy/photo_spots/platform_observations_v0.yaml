    verification_status: needs_screenshot_or_post_text
    verified_facts_zh:
      - 项目已有“七类工艺”观察卡，可作为该帖可能涉及的内容框架。
    unverified_items_zh:
      - 帖子所称“封神机位”的具体位置、画面方向和人物姿势。
      - 标题中的票价是否仍适用；票价不进入打卡点卡，须由实时官方信息核验。
