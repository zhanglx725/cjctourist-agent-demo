version: v0

# =========================================================================
# 共享默认值(由各 template <<: *pose_defaults 继承)
# 说明:
#   - Pass 1: 新增 4 维 verification;pose_defaults 锚补上 dependency_blockers
#   - Pass 2: 用户 override → 旧 trend_status 保留,新增 editorial_recommended_status
#   - Pass 3: 用户 override → 本文件不拆,改用注释分段区分 editorial / ornament
#     两类;ornament_pose_reference_pending 仍带 4 维 verification 全 pending、
#     trend_status=disabled_until_visual_review
# =========================================================================
.pose_defaults: &pose_defaults
  # --- 旧 status 字段(保留) ---
  trend_status: editorial_recommended
  # --- 新 status 字段(Pass 2 命名目标) ---
  editorial_recommended_status: editorial_recommended
  # --- 4 维 verification(对齐资格清单) ---
  content_verification_status: partial
  source_verification_status: pending
  location_verification_status: pending
  safety_verification_status: partial
  # --- 依赖: 不得脱离已审核且启用的打卡卡独立输出 ---
  dependency_blockers:
    - blocker_id: requires_enabled_photo_spot_card
      blocker_type: pose_disabled
      blocked_target: any_photo_spot_card
      reason: 姿势模板不得脱离已审核且启用的打卡卡独立输出
      must_resolve_before_output: true

templates:
  # ========================================================================
  # SECTION A: editorial_pose_template(7 条)
  # 默认 trend_status=editorial_recommended,4 维 verification=partial/pending/pending/partial
  # 用途: 项目策划的通用、安全姿势;可作为打卡卡的附属建议
  # ========================================================================

  # ---- A1 中轴站位 ----
  - pose_template_id: pose_centered_entrance
    <<: *pose_defaults
    title_zh: 中轴站位
    pose_kind: editorial_pose_template
    suitable_groups: [solo_travelers, couples, friends, first_time_visitors]
    instruction_zh: 在允许停留的开阔位置自然站立，让门厅或中轴空间成为背景；可正视镜头，也可轻微侧身望向建筑。
    safety_boundary_zh: 不站在门槛、入口正中、疏散口或人流主线上；不为对称构图阻碍通行。

  # ---- A2 侧身看细节 ----
  - pose_template_id: pose_side_detail_gaze
    <<: *pose_defaults
    title_zh: 侧身看细节
    pose_kind: editorial_pose_template
    suitable_groups: [solo_travelers, couples, friends, photography_enthusiasts]
    instruction_zh: 人物侧身，视线投向屋脊、栏板或装饰细节，形成"正在观察建筑"的自然状态。
    safety_boundary_zh: 仅作远观，不伸手指点、触摸或贴近脆弱构件。

  # ---- A3 连廊行走感 ----
  - pose_template_id: pose_walkaway_corridor
    <<: *pose_defaults
    title_zh: 连廊行走感
    pose_kind: editorial_pose_template
    suitable_groups: [solo_travelers, couples, friends]
    instruction_zh: 在不影响他人的前提下，以慢步经过或回望的瞬间配合廊柱、门洞的纵深线条。
    safety_boundary_zh: 不反复走位、奔跑或在狭窄连廊久留；有人流时放弃该姿势。

  # ---- A4 亲子一起找纹样 ----
  - pose_template_id: pose_parent_child_observation
    <<: *pose_defaults
    title_zh: 亲子一起找纹样
    pose_kind: editorial_pose_template
    suitable_groups: [parents_with_children, multigenerational]
    instruction_zh: 由成人陪同孩子一起观察纹样，以"找到什么了？"的交流瞬间取代刻意摆拍。
    safety_boundary_zh: 成人全程看护；不让儿童攀爬、触摸、奔跑或跨越设施。

  # ---- A5 记录者视角 ----
  - pose_template_id: pose_detail_observation
    <<: *pose_defaults
    title_zh: 记录者视角
    pose_kind: editorial_pose_template
    suitable_groups: [architecture_enthusiasts, art_enthusiasts, students]
    instruction_zh: 以人物远观、记笔记或使用手机记录的姿态，配合一张构件局部照片，形成"观察—记录"组图。
    safety_boundary_zh: 不使用闪光灯、补光灯或大型器材；不在通道展开纸张、脚架等物品。

  # ---- A6 半转身仰望屋脊(来源: 平台观察) ----
  - pose_template_id: pose_half_turn_roof_gaze
    <<: *pose_defaults
    title_zh: 半转身仰望屋脊
    pose_kind: editorial_pose_template
    # 平台帖来源 → 新字段名 editorial_recommended_from_visual_reference
    trend_status: editorial_recommended_from_visual_reference
    editorial_recommended_status: editorial_recommended_from_visual_reference
    source_observation_ids: [xhs_20260726_morning_photo_time]
    suitable_groups: [solo_travelers, couples, friends, photography_enthusiasts]
    instruction_zh: 人物站在开放通行区，身体略偏离镜头，视线投向屋脊或檐口；让建筑上部装饰占画面上方，人物作为尺度和视线引导。
    safety_boundary_zh: 不倚靠石雕、栏杆或柱子；不为仰拍走入限制区域，也不长时间停在通道中央。

  # ---- A7 廊下自然行走(来源: 平台观察) ----
  - pose_template_id: pose_corridor_walk_toward_camera
    <<: *pose_defaults
    title_zh: 廊下自然行走
    pose_kind: editorial_pose_template
    # 平台帖来源 → 新字段名 editorial_recommended_from_visual_reference
    trend_status: editorial_recommended_from_visual_reference
    editorial_recommended_status: editorial_recommended_from_visual_reference
    source_observation_ids: [xhs_20260726_morning_photo_time]
    suitable_groups: [solo_travelers, couples, friends]
    instruction_zh: 在不妨碍通行的情况下，以缓慢自然的步伐穿过廊下，让灯笼、柱列或屋顶线条形成中轴和纵深；可看向前方，不必刻意摆姿。
    safety_boundary_zh: 只在允许停留和拍摄的开放廊道使用；有人流时放弃拍摄，不逆行、不占道、不使用补光或大型器材。

  # ========================================================================
  # SECTION B: ornament_pose_reference(1 条)
  # 默认 trend_status=disabled_until_visual_review,4 维 verification 全 pending
  # 用途: 模仿具体装饰人物的姿势;必须有现场照片、明确人物身份和动作说明
  #       才能启用;不得由 Agent 根据题材名称臆造姿势
  # 生命周期: 与 editorial_pose_template 不同,本类受 README 红线约束
  # ========================================================================

  # ---- B1 与装饰人物呼应(待视觉审核) ----
  - pose_template_id: pose_ornament_reference_pending
    <<: *pose_defaults
    title_zh: 与装饰人物呼应（待视觉审核）
    pose_kind: ornament_pose_reference
    # 保留原始 disabled_until_visual_review;不挂到游客回答
    trend_status: disabled_until_visual_review
    editorial_recommended_status: disabled_until_visual_review
    # ornament_pose_reference 全部 4 维 verification 降级为 pending
    content_verification_status: pending
    source_verification_status: pending
    location_verification_status: pending
    safety_verification_status: pending
    # 自身被锁 + 仍需已启用打卡卡 → 双重 blocker
    dependency_blockers:
      - blocker_id: requires_enabled_photo_spot_card
        blocker_type: pose_disabled
        blocked_target: any_photo_spot_card
        reason: 姿势模板不得脱离已审核且启用的打卡卡独立输出
        must_resolve_before_output: true
      - blocker_id: ornament_pose_reference_self_lock
        blocker_type: pose_disabled
        blocked_target: pose_ornament_reference_pending
        reason: ornament_pose_reference 类型需先有现场照片和明确人物身份,当前 visual_review 未完成
        must_resolve_before_output: true
    suitable_groups: [friends, students, photography_enthusiasts]
    instruction_zh: 仅在现场照片已确认某一人物装饰的动作、并明确不涉及宗教祭祀或不雅戏仿时，可在安全距离外做轻量、尊重的动作呼应。
    safety_boundary_zh: 不模仿神像、祭祀对象或具有冒犯风险的姿态；不触摸、攀附或遮挡装饰，未经视觉审核不得推荐。
