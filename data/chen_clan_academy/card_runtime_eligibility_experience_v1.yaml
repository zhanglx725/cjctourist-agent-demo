schema_version: v1
scope: >-
  D0-E 体验卡运行资格审计。此清单只关闭或限制体验卡运行资格；不接入 Agent，
  不修改路线、空间图、TourState、VisitorProfile、StopProgram 或 RAG。
default_when_record_missing: disabled
review_basis:
  - 打卡卡 review_status 为 draft_manual_review 时不可输出。
  - 平台观察仅为内部线索，不能直接进入游客回答。
  - 姿势模板必须依附已启用且审核通过的打卡卡；disabled_until_visual_review 姿势始终禁用。
records:
