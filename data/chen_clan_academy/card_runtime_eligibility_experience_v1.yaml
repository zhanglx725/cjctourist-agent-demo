    runtime_status: disabled
    location_verification_status: partial
    safety_verification_status: partial
    allowed_scenarios: []
    reviewer: null
    reviewed_at: null
    limitations:
      - 原卡为 draft_manual_review，未完成现场审核。
      - 虽有现有节点和装饰名称映射，人物站位、可合影范围、客流与拍摄许可未核验。

