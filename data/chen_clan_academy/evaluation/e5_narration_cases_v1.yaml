schema_version: e5_narration_cases_v1
module: e5_c_narration_evaluation
baseline_commit: 824f8446fb2f23c5adb0ed7491e69b8a39c636cb
branch: codex/e5-c-narration-evaluation
review_status: draft
case_scope: >-
  E5-C static traceability and runtime-invariant cases. Cases that require
  NarrationCoverage, NarrationPlan, or first/subsequent narration behavior are
  intentionally blocked until E5-A is integrated.
hard_failure_catalog:
  - 文物不属于当前点审核对象白名单。
  - 虚构现有证据未支持的事实。
  - 将无来源的文化结论作为事实输出。
  - 超出 StopProgram 的本点内容预算。
  - 讲解、问答或取证修改 TourState。
  - listen_only 模式主动要求游客完成互动任务或回答问题。
  - 将研究观点表达为确定的馆方事实。
