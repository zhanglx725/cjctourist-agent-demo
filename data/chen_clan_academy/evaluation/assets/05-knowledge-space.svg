<g font-size="23" fill="#274966"><text x="208" y="255" font-weight="700">游客问题 / 当前点位</text><text x="208" y="292">场景、对象、意图</text><text x="578" y="255" font-weight="700">场景过滤</text><text x="578" y="292">点位、审核状态、问题类型</text><text x="948" y="255" font-weight="700">混合检索</text><text x="948" y="292">BM25 + BGE + RRF</text><text x="1355" y="255" font-weight="700">受控事实集合</text><text x="1355" y="292">来源、边界、时效、公开范围</text><text x="575" y="592" font-weight="700">审核路线与空间拓扑</text><text x="575" y="632">点位目录、合法连接、步行时间</text><text x="1025" y="592" font-weight="700">回答 / ContentPlan</text><text x="1025" y="632">问答、讲解、下一步提示</text></g>
