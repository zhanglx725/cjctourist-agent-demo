<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Microsoft YaHei,Arial" text-anchor="middle"><text x="800" y="75" font-size="42" font-weight="700" fill="#163B66">知识检索与空间计算协同</text><text x="800" y="116" font-size="22" fill="#56718E">以审核知识回答问题，以空间拓扑保障路线可执行</text>
