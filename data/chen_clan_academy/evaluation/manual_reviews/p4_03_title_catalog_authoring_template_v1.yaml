# P4-03 人工称号库填写模板（合并版）
#
# 填写规则：
# 1. 不要修改 category_id；它必须与 post_visit_award.py 中的稳定 ID 对应。
# 2. 每个 candidate_id 在整个文件中必须唯一，建议使用小写英文和下划线。
# 3. title_zh 建议为 4～8 个汉字，不得暗示官方认证、能力评级或身份认定。
# 4. reason_template 与 blessing_template 只能引用 allowed_placeholders 中的变量。
# 5. 新条目先保持 review_status: draft；人工审核通过后改为 approved。
# 6. enabled 仅能在 review_status: approved 后设为 true。
# 7. 暂无翻译时将对应字段保留为空字符串，不要使用机器生成内容冒充人工审核译文。
# 8. candidates 的文件顺序就是未来同类别“换一个称号”的冻结轮换顺序；已上线
#    后调整顺序必须提升 catalog_version，不得依赖随机抽取或 API 自由生成。
#
# 合并说明：
# 1. 本文件将 classic（正经文雅）与 playful（互动玩味）两份草稿合并到同一份文件。
# 2. 每个 category 内部排序：1 个 approved default → classic drafts → playful drafts。
# 3. classic 与 playful 中只有 1 处 candidate_id 冲突（route_finisher_no_skip），
#    playful 的同名条目已重命名为 route_finisher_no_skip_team 加以区分。
# 4. 其它规则与单版本一致：
#    - 不要修改 category_id；它必须与 post_visit_award.py 中的稳定 ID 对应。
#    - 每个 candidate_id 在整个文件中必须唯一。
#    - title_zh 建议为 4～8 个汉字，不得暗示官方认证、能力评级或身份认定。
#    - reason_template 与 blessing_template 只能引用 allowed_placeholders 中的变量。
#    - 新条目先保持 review_status: draft；人工审核通过后改为 approved。
#    - enabled 仅能在 review_status: approved 后设为 true。
#    - 暂无翻译时将对应字段保留为空字符串，不要使用机器生成内容冒充人工审核译文。
# 5. 总候选 48 个，均已完成人工审核并启用；运行时仍只在命中的同一类别内轮换。

schema_version: post_visit_title_catalog_authoring_v1
catalog_version: "0.4.0-approved"
locale_default: zh-CN

global_policy:
  selection_mode: deterministic
  official_certification: false
  public_disclaimer_zh: 这是本次游览的趣味纪念称号，不是官方认证或游客评级。
  title_length_zh:
    min_characters: 4
    max_characters: 8
  prohibited_claims:
    - 官方认证
    - 专业资质
    - 能力等级
    - 身份鉴定
    - 性格诊断
  allowed_placeholders:
    - question_count
    - visited_stop_count
    - matched_interests
    - introduced_crafts
    - introduced_topics
    - explanation_style
    - language

