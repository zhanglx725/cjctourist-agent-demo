review_checklist:
  - candidate_id 全局唯一
  - category_id 与既有策略一致
  - 中文称号长度符合约束
  - 称号不包含官方认证或能力评级暗示
  - 理由只使用可审计的游览事实
  - 祝福为原创或已确认拥有使用权
  - 占位符全部位于 allowed_placeholders
  - 翻译经过对应语言人工审核
  - 至少保留一个已审核且启用的中性回退称号
