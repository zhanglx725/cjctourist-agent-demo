      interaction state show an active, unfinished route with stop_phase=navigating and one
      approved pending_stop_id, dispatch the existing arrive_at_stop event with that pending ID.
      Retain the current clarification path for no route, no pending stop, finished routes,
      ambiguous named locations, and non-route self-arrival. This reuses the frozen event
      handler and does not alter arrival-versus-completion semantics.
    acceptance_test: >-
      Plan a route in a fresh thread, then send '我已到达' without a node name. It must enter
