      - role: assistant
        content: "您有多少分钟可用于游览？例如“30分钟”。"
      - role: user
        content: "两个小时"
      - role: assistant
        content: "您有多少分钟可用于游览？例如“30分钟”。"
      - role: user
        content: "我有120分钟用于游览"

    expected:
      route: "profile_collection -> direct_route after any remaining required preferences are collected"
      state_change: >-
        Normalize '两个小时' to the canonical 120-minute time budget on the first user message,
        or at latest on the direct follow-up, without asking for duration again.
      card_type: "none"
      behavior: >-
        Accept common Chinese duration expressions such as '两小时', '两个小时', and '2小时'
        as explicit time-budget input. Continue only with genuinely missing profile information.

    actual:
      route: "profile_collection"
      response_summary: >-
        The first request explicitly contained '两个小时', but profile collection asked for
        minutes. The direct follow-up '两个小时' was ignored and received the identical duration
        question. Only '我有120分钟用于游览' was accepted, after which the agent asked about
        interests.
      state_change: "The time budget was not captured until the numeric-minute phrasing was used."
      selected_card_ids: []
      source_ids: []

    scores:
      routing_score: 1
      state_score: 2
      factual_score: 2
      source_score: 2
      card_score: 2
      spatial_score: 2
      profile_score: 0
      clarity_score: 0
      safety_score: 2

    problem_description: >-
      The visitor-profile duration parser does not recognize the Chinese hour expression
      '两个小时'. It repeatedly requests a duration already supplied and accepts only an
      explicit numeric-minute form such as '120分钟'.
    user_goal: >-
      State a natural Chinese duration once and have the agent remember it, normalize it to a
      route-planning time budget, and proceed to the next genuinely missing preference.
    evidence_refs:
      - "User-supplied LangSmith Studio screenshots: two-hour request and follow-up were both asked for duration again; 120-minute wording advanced collection. Trace URL pending."

    suspected_layer: visitor_profile
    proposed_solution: >-
      Extend the existing duration normalization/parsing path to accept Chinese numeral and
      hour-unit expressions, including '两小时', '两个小时', and '2小时', and normalize all
      accepted forms to the current canonical minute field. Keep the existing VisitorProfile as
      the sole fact source; do not introduce a second duration field. Add focused tests for
      initial-request and follow-up extraction, including rejection of ambiguous or invalid
      durations.
    acceptance_test: >-
      In fresh threads, submit '我要参观两个小时，帮我规划一下路线' and separately answer
      '两个小时' to a duration prompt. Both must set the same 120-minute profile value and must
      not repeat the duration question. The next prompt may ask only for a missing preference,
      and planning must use the normalized 120-minute budget.
    status: fixed_pending_verification
