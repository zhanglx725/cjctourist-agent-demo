    problem_description: >-
      After the agent had planned a route, a generic arrival message ('我已到达') was routed to
      clarification instead of the active route's pending first stop. The current text intent
      adapter requires a named reviewed node even when the only valid planned next stop is
      already stored in interaction state.
    user_goal: >-
      Start the planned tour naturally: after receiving a route, say '我到了' or '我已到达' and
      receive the first-stop explanation without having to repeat the point name shown by the
      route.
