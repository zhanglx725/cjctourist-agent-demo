    tested_branch: main
    test_date: "2026-07-27"
    module: route_planning
    issue_type: content_quality
    severity: P1
    reproducibility: high
    preconditions: "60-minute craft route request"
    conversation: ["我有60分钟，想重点了解木雕和建筑工艺。"]
    expected: "A route must stay within available time."
    actual: "Returned a 60-minute route estimated at 61 minutes."
    problem_description: "Time budget is exceeded before tour starts."
    evidence_refs: ["manual observation: A-03"]
    suspected_layer: unknown
    proposed_solution: "Reject or trim route plans that exceed the confirmed budget."
    acceptance_test: "Estimated duration <= available_minutes."
    status: P1
  - finding_id: e2_a_002
    reviewer: "19989008830"
    tested_commit: d00396969761025896358d90785f0c75ba7a166c
    tested_branch: main
    test_date: "2026-07-27"
    module: route_planning
    issue_type: routing
    severity: P1
    reproducibility: high
    preconditions: "Existing craft route and preference context"
    conversation: ["我有1小时，想重点了解木雕和建筑工艺。", "我有90分钟，想做研学参观。", "我只剩20分钟了，帮我调整路线。"]
    expected: "Equivalent duration phrasing and updated time/interest must create a matching remaining route."
    actual: "1小时 entered RAG instead of route planning; 90 minutes still returned a 60-minute craft route; 20-minute update did not create a usable replan."
    problem_description: "Duration normalization, profile application, and dynamic replan are inconsistent."
    evidence_refs: ["manual observation: A-04,A-05,A-10"]
    suspected_layer: intent_routing
    proposed_solution: "Normalize durations before routing and replan from non-completed stops only."
    acceptance_test: "1小时=60分钟; 90-minute study request differs from 60-minute craft route; 20-minute update yields <=20-minute remaining itinerary."
    status: P1
  - finding_id: e2_b_001
    reviewer: "19989008830"
    tested_commit: d00396969761025896358d90785f0c75ba7a166c
    tested_branch: main
    test_date: "2026-07-27"
    module: tour_event
    issue_type: state_error
    severity: P1
    reproducibility: high
    preconditions: "Route has suggested 前庭 after 前院中部."
    conversation: ["现在出发，已经到达", "已到达前庭", "参观完前院中部和前庭，下一站去哪里"]
    expected: "Ask a targeted point clarification when needed; arrival must not mean completion; next-stop advice must not repeat a stated completed point."
    actual: "Generic arrival was not resolved; later reply named 前院中部 as next stop after the user stated it had been visited."
    problem_description: "Pending stop and completion semantics are not carried safely through natural language."
    evidence_refs: ["studio thread 019fa2c7-b5f6-7b50-b774-12edef2c612f messages 54-65"]
    suspected_layer: tour_state
    proposed_solution: "Use pending stop in clarification and distinguish stated visit claims from explicit completion confirmation."
    acceptance_test: "Arrival changes current stop only; only explicit confirmation writes visited; next-step never repeats confirmed/stated-completed point without clarification."
    status: P1
  - finding_id: e2_c_001
    reviewer: "19989008830"
