review_checklist:
- 名称、地址与坐标指向同一个真实 POI
- decision 为 approve、reject 或 needs_review
- approve 条目必须有明确类别、推荐理由和至少一个标签
- 推荐理由能够说明与陈家祠游览后的衔接价值
- one_line_summary_zh 不包含排名、保证、营销夸张或未经来源支持的事实
- evidence_url 是能直接支持名称、类型或特色的页面，不是搜索结果页
- 营业时间、价格、预约、无障碍信息没有可靠来源时已经删除而非猜测
- 不人工估算最短或最长停留时间
- 不保证实时营业、价格、排队、空位、订位或服务品质
- reject 条目已在 review.notes 中写明简短原因
- 只有 review.status 为 approved 且 enabled 为 true 的条目进入推荐池
