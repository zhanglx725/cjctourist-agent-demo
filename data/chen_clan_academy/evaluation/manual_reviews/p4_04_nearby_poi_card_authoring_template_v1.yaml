# P4-04 馆外附近推荐卡：精简人工标注模板
#
# 目标：让爬取 CSV 负责搬运客观字段，让人工只判断“是否值得推荐、为什么推荐、
# 有什么边界”。没有可靠资料的可选字段直接省略，不填写 unknown。
#
# 人工必填字段只有：decision、category、one_line_summary_zh、
# why_recommend_zh、tags、evidence_url 和 review。
# name_zh、address_zh、坐标、地图链接和 source_row_id 应从 CSV 自动导入，人工只纠错。
# 营业时间、价格、预约、无障碍等动态信息仅在存在直接可靠来源时填写。

schema_version: nearby_poi_card_authoring_v1
catalog_version: "0.2.0-draft"
venue_id: chen_clan_academy
locale_default: zh-CN

catalog_policy:
  recommendation_count: 3
  runtime_approved_only: true
  isolate_from_indoor_tour_state: true
  allowed_categories:
    - food
    - cafe_or_rest
    - heritage_site
    - museum_or_gallery
    - park_or_public_space
    - shopping_or_craft
    - hotel_or_accommodation_area
    - transport_or_visitor_service
  allowed_decisions: [approve, reject, needs_review]
  required_public_uncertainty_zh: 营业、价格、排队和交通信息可能变化，出发前请以场所官方页面或地图的最新信息为准。

cards:
  - # CSV 自动导入区：人工只纠错
    source_row_id: fill_from_csv_row_or_stable_source_id
    poi_id: fill_stable_unique_id
    name_zh: 待从CSV导入
    original_category: 待从CSV导入
    address_zh: 待从CSV导入
    latitude: null
    longitude: null
    map_url: ""
    source_url: ""

    # 人工核心标注区：全部必填
    decision: needs_review
    category: heritage_site
    one_line_summary_zh: 待填写；用一句客观短句说明这里是什么、有什么稳定特色。
    why_recommend_zh: 待填写；说明它为什么适合接在陈家祠游览之后，不写“最好”“必去”。
    tags:
      - fill_one_or_more_controlled_tags
    evidence_url: https://example.invalid/replace-with-direct-source

    review:
      status: draft
      reviewed_by: ""
      reviewed_at: ""
      notes: ""
    enabled: false

# 可选字段不要预先复制到每张卡。确有已核验内容时，才按需加入卡片：
#
# location_hint_zh: 稳定的相对方位描述
# arrival_note_zh: 入口、换乘或到达提醒
# caution_zh: 真实必要的提醒
# dynamic_info:
#   opening_hours_zh: 已核验营业时间
#   price_zh: 已核验价格
#   reservation_zh: 已核验预约要求
#   accessibility_zh: 已核验无障碍信息
#   checked_at: "YYYY-MM-DD"
#   official_url: https://直接支持上述动态信息的官方页面

controlled_tags:
  - local_food
  - cantonese_food
  - tea_or_coffee
  - architecture
  - history
  - folk_craft
  - museum
  - photography
  - relaxing
  - shopping
  - family_friendly
  - rainy_day_option
  - evening_option
  - short_stop
  - extended_visit

review_checklist:
  - 名称、地址与坐标指向同一个真实 POI
  - decision 为 approve、reject 或 needs_review
  - approve 条目必须有明确类别、推荐理由和至少一个标签
  - 推荐理由能够说明与陈家祠游览后的衔接价值
  - one_line_summary_zh 不包含排名、保证、营销夸张或未经来源支持的事实
  - evidence_url 是能直接支持名称、类型或特色的页面，不是搜索结果页
  - 营业时间、价格、预约、无障碍信息没有可靠来源时已经删除而非猜测
  - 不人工估算最短或最长停留时间
  - 不保证实时营业、价格、排队、空位、订位或服务品质
  - reject 条目已在 review.notes 中写明简短原因
  - 只有 review.status 为 approved 且 enabled 为 true 的条目进入推荐池
