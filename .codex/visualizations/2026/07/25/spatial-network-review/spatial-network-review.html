<section id="spatial-network-review" aria-label="陈家祠空间网络审核图">
  <div class="viz-controls">
    <label class="form-label" for="node-select">聚焦节点
      <select id="node-select" class="form-select"></select>
    </label>
    <label class="form-check" for="edge-labels">
      <input id="edge-labels" class="form-check-input" type="checkbox" checked>
      <span class="form-check-label">显示边编号与预计秒数</span>
    </label>
  </div>
  <div id="selected-detail" class="text-small text-muted" aria-live="polite">未选择节点：显示全部 39 条边。</div>
  <div class="viz-row text-small" aria-label="图例">
    <span><svg class="legend-dot guide" aria-hidden="true"><circle cx="7" cy="7" r="5"></circle></svg>讲解点</span>
    <span><svg class="legend-dot hall" aria-hidden="true"><rect x="2" y="2" width="10" height="10"></rect></svg>厅堂/厢房/斋</span>
    <span><svg class="legend-dot entrance" aria-hidden="true"><path d="M7 1 L13 12 L1 12 Z"></path></svg>入口</span>
    <span><svg class="legend-dot other" aria-hidden="true"><circle cx="7" cy="7" r="4"></circle></svg>其他节点</span>
    <span>边文字：编号 | 预计步行秒数</span>
  </div>
  <svg id="network-svg" viewBox="0 0 2290 1339" role="img" aria-label="基于地图像素坐标的陈家祠空间网络。可选择节点查看关联边。">
    <title>陈家祠空间网络审核图</title>
    <desc>节点位置来自 marker_inventory_v0.csv，边来自 edges_v0.csv；步行时间均为地图估算，待现场复核。</desc>
    <g id="edge-layer"></g>
    <g id="edge-label-layer"></g>
    <g id="node-layer"></g>
  </svg>
</section>
<style>
  #spatial-network-review { display: grid; gap: 0.65rem; }
  #network-svg { width: 100%; height: auto; background: color-mix(in srgb, var(--muted) 45%, transparent); }
  #network-svg .edge { stroke: var(--muted-foreground); stroke-width: 5; opacity: 0.56; }
  #network-svg .edge.active { stroke: var(--viz-series-1); stroke-width: 10; opacity: 1; }
  #network-svg .edge-label { fill: var(--foreground); font-size: 26px; text-anchor: middle; paint-order: stroke; stroke: var(--background); stroke-width: 7; stroke-linejoin: round; }
  #network-svg .node { stroke: var(--foreground); stroke-width: 4; }
  #network-svg .node.guide { fill: var(--viz-series-1); }
  #network-svg .node.hall { fill: var(--viz-series-2); }
  #network-svg .node.entrance { fill: var(--destructive); }
  #network-svg .node.other { fill: var(--secondary); }
  #network-svg .node.active { stroke: var(--primary); stroke-width: 12; }
  #network-svg .node-label { fill: var(--foreground); font-size: 27px; text-anchor: middle; paint-order: stroke; stroke: var(--background); stroke-width: 7; stroke-linejoin: round; }
  #network-svg .node-id { fill: var(--muted-foreground); font-size: 18px; text-anchor: middle; paint-order: stroke; stroke: var(--background); stroke-width: 5; }
  #spatial-network-review .legend-dot { width: 14px; height: 14px; vertical-align: -2px; margin-right: 0.2rem; stroke: var(--foreground); stroke-width: 1.3px; }
  #spatial-network-review .legend-dot.guide { fill: var(--viz-series-1); }
  #spatial-network-review .legend-dot.hall { fill: var(--viz-series-2); }
  #spatial-network-review .legend-dot.entrance { fill: var(--destructive); }
  #spatial-network-review .legend-dot.other { fill: var(--secondary); }
</style>
<script>
(() => {
  const root = document.getElementById('spatial-network-review');
  const nodes = [{"id":"stop_rear_east_courtyard","n":"后院东侧","t":"guide_stop","x":1361,"y":98},{"id":"stop_rear_courtyard_west","n":"后庭西侧","t":"guide_stop","x":1033,"y":306},{"id":"stop_rear_courtyard","n":"后庭","t":"guide_stop","x":1149,"y":316},{"id":"stop_rear_courtyard_east","n":"后庭东侧","t":"guide_stop","x":1287,"y":316},{"id":"stop_rear_west_courtyard","n":"后西庭","t":"guide_stop","x":793,"y":348},{"id":"stop_east_corridor_middle","n":"东走廊-中部","t":"guide_stop","x":1795,"y":382},{"id":"stop_west_corridor_north","n":"西侧走廊-北部","t":"guide_stop","x":485,"y":388},{"id":"stop_front_courtyard_north","n":"前庭","t":"guide_stop","x":1151,"y":540},{"id":"stop_juxian_hall","n":"中进聚贤堂","t":"guide_stop","x":1149,"y":626},{"id":"stop_front_east_courtyard","n":"前东庭","t":"guide_stop","x":1563,"y":632},{"id":"stop_front_west_courtyard","n":"前西庭","t":"guide_stop","x":727,"y":634},{"id":"entrance_main_outside","n":"大门外","t":"entrance","x":1149,"y":858},{"id":"stop_front_courtyard_west","n":"前院西部靠边","t":"guide_stop","x":595,"y":974},{"id":"stop_front_courtyard_center","n":"前院中部","t":"guide_stop","x":1145,"y":984},{"id":"stop_front_courtyard_east","n":"前院东部靠边","t":"guide_stop","x":1705,"y":990},{"id":"label_rear_garden","n":"后花园","t":"courtyard","x":784,"y":56},{"id":"label_rear_west_study","n":"后西斋","t":"study","x":575,"y":174},{"id":"label_rear_west_hall","n":"后进西厅","t":"hall","x":795,"y":174},{"id":"label_rear_main_hall","n":"后进正厅","t":"hall","x":1150,"y":174},{"id":"label_rear_east_hall","n":"后进东厅","t":"hall","x":1490,"y":174},{"id":"label_rear_east_study","n":"后东斋","t":"study","x":1715,"y":174},{"id":"label_rear_west_wing","n":"后西厢","t":"wing","x":580,"y":291},{"id":"label_rear_east_wing","n":"后东厢","t":"wing","x":1710,"y":291},{"id":"label_restroom","n":"洗手间","t":"service","x":307,"y":417},{"id":"label_middle_west_hall","n":"中进西厅","t":"hall","x":726,"y":475},{"id":"label_juxian_hall","n":"中进聚贤堂","t":"hall","x":1150,"y":475},{"id":"label_middle_east_hall","n":"中进东厅","t":"hall","x":1570,"y":475},{"id":"label_middle_east_wing","n":"中东厢","t":"wing","x":1750,"y":449},{"id":"label_moon_platform","n":"月台","t":"platform","x":1150,"y":600},{"id":"label_front_west_wing","n":"前西厢","t":"wing","x":510,"y":606},{"id":"label_front_east_wing","n":"前东厢","t":"wing","x":1790,"y":606},{"id":"label_front_west_study","n":"前西斋","t":"study","x":509,"y":767},{"id":"label_first_west_hall","n":"首进西厅","t":"hall","x":727,"y":745},{"id":"label_first_main_hall","n":"首进正厅","t":"hall","x":1150,"y":745},{"id":"label_first_east_hall","n":"首进东厅","t":"hall","x":1570,"y":745},{"id":"label_front_east_study","n":"前东斋","t":"study","x":1790,"y":767},{"id":"label_west_gate","n":"西门","t":"gate","x":148,"y":862},{"id":"label_east_gate","n":"东门","t":"gate","x":2142,"y":862},{"id":"label_office","n":"办公室","t":"service","x":2015,"y":493},{"id":"label_front_courtyard","n":"前院","t":"courtyard","x":1150,"y":1232}];
  const edges = [{"id":"edge_001","a":"entrance_main_outside","b":"stop_front_courtyard_center","s":25},{"id":"edge_002","a":"stop_front_courtyard_center","b":"label_first_main_hall","s":20},{"id":"edge_003","a":"label_first_main_hall","b":"label_moon_platform","s":20},{"id":"edge_004","a":"label_moon_platform","b":"stop_juxian_hall","s":20},{"id":"edge_005","a":"stop_juxian_hall","b":"label_rear_main_hall","s":30},{"id":"edge_006","a":"label_rear_main_hall","b":"label_rear_east_hall","s":30},{"id":"edge_007","a":"label_rear_east_hall","b":"label_middle_east_hall","s":55},{"id":"edge_008","a":"label_middle_east_hall","b":"label_middle_east_wing","s":25},{"id":"edge_009","a":"label_middle_east_wing","b":"label_front_east_wing","s":25},{"id":"edge_010","a":"stop_juxian_hall","b":"label_middle_west_hall","s":25},{"id":"edge_011","a":"label_middle_west_hall","b":"label_rear_main_hall","s":35},{"id":"edge_012","a":"label_rear_east_hall","b":"label_rear_east_study","s":25},{"id":"edge_013","a":"label_rear_east_study","b":"label_rear_east_wing","s":20},{"id":"edge_014","a":"label_rear_east_wing","b":"label_middle_east_hall","s":45},{"id":"edge_015","a":"label_front_east_wing","b":"label_first_east_hall","s":35},{"id":"edge_016","a":"label_first_east_hall","b":"label_first_west_hall","s":60},{"id":"edge_017","a":"label_first_west_hall","b":"label_front_west_wing","s":25},{"id":"edge_019","a":"label_rear_west_hall","b":"label_rear_main_hall","s":30},{"id":"edge_020","a":"stop_juxian_hall","b":"label_middle_east_hall","s":25},{"id":"edge_021","a":"label_first_main_hall","b":"label_first_west_hall","s":25},{"id":"edge_022","a":"label_first_main_hall","b":"label_first_east_hall","s":25},{"id":"edge_023","a":"stop_front_courtyard_west","b":"label_front_courtyard","s":15},{"id":"edge_024","a":"stop_front_courtyard_center","b":"label_front_courtyard","s":15},{"id":"edge_025","a":"stop_front_courtyard_east","b":"label_front_courtyard","s":15},{"id":"edge_026","a":"stop_front_courtyard_north","b":"label_moon_platform","s":25},{"id":"edge_027","a":"stop_rear_courtyard_west","b":"label_rear_west_hall","s":15},{"id":"edge_028","a":"stop_rear_courtyard","b":"label_rear_main_hall","s":15},{"id":"edge_029","a":"stop_rear_courtyard_east","b":"label_rear_east_hall","s":15},{"id":"edge_030","a":"stop_rear_west_courtyard","b":"label_rear_west_hall","s":15},{"id":"edge_031","a":"stop_rear_east_courtyard","b":"label_rear_east_hall","s":15},{"id":"edge_032","a":"stop_east_corridor_middle","b":"label_rear_east_wing","s":15},{"id":"edge_033","a":"stop_east_corridor_middle","b":"label_middle_east_wing","s":15},{"id":"edge_034","a":"stop_west_corridor_north","b":"label_rear_west_wing","s":15},{"id":"edge_035","a":"stop_west_corridor_north","b":"label_middle_west_hall","s":15},{"id":"edge_036","a":"stop_front_east_courtyard","b":"label_first_east_hall","s":15},{"id":"edge_037","a":"stop_front_west_courtyard","b":"label_first_west_hall","s":15},{"id":"edge_038","a":"stop_juxian_hall","b":"label_juxian_hall","s":0},{"id":"edge_039","a":"label_front_courtyard","b":"label_first_main_hall","s":20}];
  const nodeById = new Map(nodes.map(node => [node.id, node]));
  const select = root.querySelector('#node-select');
  const detail = root.querySelector('#selected-detail');
  const showLabels = root.querySelector('#edge-labels');
  const edgeLayer = root.querySelector('#edge-layer');
  const labelLayer = root.querySelector('#edge-label-layer');
  const nodeLayer = root.querySelector('#node-layer');
  const ns = 'http://www.w3.org/2000/svg';
  const kind = node => node.t === 'guide_stop' ? 'guide' : node.t === 'entrance' ? 'entrance' : ['hall','wing','study','platform'].includes(node.t) ? 'hall' : 'other';
  select.add(new Option('全部节点（不聚焦）', ''));
  nodes.slice().sort((a, b) => a.n.localeCompare(b.n, 'zh-Hans-CN')).forEach(node => select.add(new Option(`${node.n} — ${node.id}`, node.id)));
  const svgEl = (tag, attrs, text) => { const el = document.createElementNS(ns, tag); Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value)); if (text) el.textContent = text; return el; };
  function render() {
    const selected = select.value;
    edgeLayer.replaceChildren(); labelLayer.replaceChildren(); nodeLayer.replaceChildren();
    const incident = edges.filter(edge => edge.a === selected || edge.b === selected);
    edges.forEach(edge => {
      const a = nodeById.get(edge.a); const b = nodeById.get(edge.b);
      const active = selected && (edge.a === selected || edge.b === selected);
      edgeLayer.append(svgEl('line', {x1:a.x, y1:a.y, x2:b.x, y2:b.y, class:`edge${active ? ' active' : ''}`, 'data-edge':edge.id}));
      if (showLabels.checked) {
        const mx = (a.x + b.x) / 2; const my = (a.y + b.y) / 2 - 11;
        labelLayer.append(svgEl('text', {x:mx, y:my, class:'edge-label'}, `${edge.id.replace('edge_', 'E') } | ${edge.s}s`));
      }
    });
    nodes.forEach(node => {
      const active = node.id === selected;
      const cls = `node ${kind(node)}${active ? ' active' : ''}`;
      let shape;
      if (node.t === 'entrance') shape = svgEl('path', {d:`M ${node.x} ${node.y-17} L ${node.x+16} ${node.y+14} L ${node.x-16} ${node.y+14} Z`, class:cls});
      else if (kind(node) === 'hall') shape = svgEl('rect', {x:node.x-12,y:node.y-12,width:24,height:24,rx:2,class:cls});
      else shape = svgEl('circle', {cx:node.x,cy:node.y,r:12,class:cls});
      shape.setAttribute('aria-label', `${node.n}，${node.id}`);
      shape.addEventListener('click', () => { select.value = node.id; render(); });
      nodeLayer.append(shape);
      nodeLayer.append(svgEl('text', {x:node.x,y:node.y-21,class:'node-label'}, node.n));
      nodeLayer.append(svgEl('text', {x:node.x,y:node.y+34,class:'node-id'}, node.id));
    });
    if (!selected) detail.textContent = `未选择节点：显示全部 ${edges.length} 条边。边文字为编号 | 预计步行秒数，均待现场复核。`;
    else { const node = nodeById.get(selected); detail.textContent = `已选择：${node.n}（${node.id}），关联 ${incident.length} 条边：${incident.map(edge => `${edge.id}（${edge.s}s）`).join('、') || '无'}。`; }
  }
  select.addEventListener('change', render);
  showLabels.addEventListener('change', render);
  render();
})();
</script>
